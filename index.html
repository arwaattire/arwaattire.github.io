<style>
  :root{
    --plum-950:#1B0620;
    --plum-900:#2E0B33;
    --plum-800:#431247;
    --plum-600:#6A2A63;
    --ivory:#F6F1E8;
    --bone:#E3D7C6;
    --gold:#B4903F;
    --ink:#2A1226;
    --muted:#6B5062;

    --shell:min(480px, 100%);
    --ease:cubic-bezier(.22,.68,.34,1);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  body{
    min-height:100dvh;
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,.022) 0 2px, transparent 2px 5px),
      repeating-linear-gradient(-45deg, rgba(0,0,0,.05) 0 2px, transparent 2px 5px),
      linear-gradient(178deg, var(--plum-800) 0%, var(--plum-900) 46%, var(--plum-950) 100%);
    background-attachment:fixed;
    font-family:"Manrope", ui-sans-serif, system-ui, sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
  }

  .shell{
    width:var(--shell);
    display:flex;
    flex-direction:column;
    min-height:100dvh;
  }

  /* ---------- crest ---------- */
  .crest{
    padding:38px 24px 0;
    display:flex;
    justify-content:center;
    position:relative;
    z-index:3;
    margin-bottom:-66px;
  }
  .medallion{
    width:138px;height:138px;
    border-radius:50%;
    background:#fff;
    overflow:hidden;
    display:grid;place-items:center;
    box-shadow:0 18px 44px -14px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.4);
    animation:drop .9s var(--ease) both;
  }
  .medallion img{width:68%;height:68%;object-fit:contain;display:block;}

  /* ---------- card ---------- */
  .card{
    flex:1;
    background:var(--ivory);
    border-radius:36px 36px 0 0;
    padding:86px 22px 30px;
    position:relative;
    box-shadow:0 -20px 60px -30px rgba(0,0,0,.6);
    animation:rise .95s var(--ease) both;
    display:flex;
    flex-direction:column;
  }
  .card::before{
    content:"";
    position:absolute;
    left:24px;right:24px;top:16px;
    height:1px;
    background:repeating-linear-gradient(to right, var(--bone) 0 9px, transparent 9px 17px);
  }

  h1{
    margin:0;
    text-align:center;
    font-family:"Cormorant Garamond", Georgia, serif;
    font-weight:500;
    font-size:clamp(38px, 11.5vw, 50px);
    letter-spacing:.16em;
    text-indent:.16em;
    color:var(--plum-800);
    line-height:1.05;
  }
  .tagline{
    margin:10px 0 0;
    text-align:center;
    font-family:"Cormorant Garamond", Georgia, serif;
    font-size:clamp(20px, 5.6vw, 24px);
    font-style:italic;
    font-weight:400;
    color:#54324E;
  }

  /* ---------- primary action ---------- */
  .order{
    display:flex;
    align-items:center;
    gap:15px;
    margin:30px 0 0;
    padding:18px 18px;
    border-radius:20px;
    text-decoration:none;
    color:var(--ivory);
    background:linear-gradient(135deg, var(--plum-800), var(--plum-600));
    box-shadow:0 16px 32px -16px rgba(67,18,71,.95), inset 0 0 0 1px rgba(198,166,100,.5);
    transition:transform .22s var(--ease), box-shadow .22s var(--ease);
    animation:fadeUp .7s var(--ease) .15s both;
  }
  .order:hover{transform:translateY(-2px);box-shadow:0 22px 38px -16px rgba(67,18,71,1), inset 0 0 0 1px rgba(198,166,100,.85);}
  .order:active{transform:translateY(0);}
  .order .glyph{width:28px;height:28px;flex:none;fill:var(--ivory);}
  .order .txt{flex:1;min-width:0;}
  .order strong{display:block;font-size:17px;font-weight:700;}
  .order span{display:block;font-size:13px;color:rgba(246,241,232,.78);margin-top:3px;}
  .order .arrow{width:17px;height:17px;flex:none;stroke:rgba(246,241,232,.8);}

  /* ---------- social ---------- */
  .label{
    margin:30px 0 12px;
    font-size:11px;
    font-weight:700;
    letter-spacing:.26em;
    text-transform:uppercase;
    color:var(--muted);
  }

  .links{
    list-style:none;margin:0;padding:0;
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:12px;
  }
  .links li{animation:fadeUp .55s var(--ease) both;}
  .links li:nth-child(1){animation-delay:.3s;}
  .links li:nth-child(2){animation-delay:.4s;}
  .links li:nth-child(3){animation-delay:.5s;}

  .row{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:11px;
    padding:20px 8px 17px;
    background:#fff;
    border:1px solid var(--bone);
    border-radius:22px;
    text-decoration:none;
    color:inherit;
    height:100%;
    transition:border-color .2s var(--ease), box-shadow .2s var(--ease), transform .2s var(--ease);
  }
  .row:hover{
    border-color:var(--gold);
    box-shadow:0 14px 28px -18px rgba(42,18,38,.85);
    transform:translateY(-3px);
  }
  .tile{
    width:50px;height:50px;flex:none;
    border-radius:15px;
    display:grid;place-items:center;
    box-shadow:0 8px 16px -10px rgba(42,18,38,.55);
  }
  .tile svg{width:24px;height:24px;fill:#fff;}
  .tile.tiktok{background:#0D0D0D;}
  .tile.instagram{background:linear-gradient(45deg,#F09433 5%,#DC2743 45%,#BC1888 95%);}
  .tile.facebook{background:#1877F2;}

  .row strong{
    font-size:13.5px;
    font-weight:700;
    color:var(--plum-800);
    letter-spacing:.01em;
    text-align:center;
  }

  /* ---------- footer ---------- */
  footer{
    margin-top:auto;
    padding-top:34px;
  }
  .seam-rule{
    height:1px;
    background:repeating-linear-gradient(to right, var(--bone) 0 9px, transparent 9px 17px);
    margin-bottom:18px;
  }
  .footrow{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .mark{
    font-size:10.5px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--muted);
    font-weight:600;
  }
  .share{
    appearance:none;
    border:1px solid var(--bone);
    background:transparent;
    border-radius:999px;
    padding:9px 17px;
    font-family:inherit;
    font-size:12.5px;
    font-weight:600;
    letter-spacing:.04em;
    color:var(--plum-800);
    cursor:pointer;
    transition:border-color .2s var(--ease), background .2s var(--ease);
  }
  .share:hover{border-color:var(--gold);background:rgba(180,144,63,.12);}

  a:focus-visible, button:focus-visible{
    outline:2px solid var(--plum-600);
    outline-offset:3px;
  }
  .order:focus-visible{outline-color:var(--gold);}

  @keyframes drop{from{opacity:0;transform:translateY(-16px) scale(.9);}to{opacity:1;transform:none;}}
  @keyframes rise{from{opacity:0;transform:translateY(26px);}to{opacity:1;transform:none;}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;}
  }
</style>
</head>

<script>
  document.getElementById('shareBtn').addEventListener('click', async function(){
    var btn = this;
    var url = window.location.href;
    try{
      if(navigator.share){
        await navigator.share({title:'Arwa Attire', text:'Pick it. Stitch it. Wear it.', url:url});
        return;
      }
      await navigator.clipboard.writeText(url);
      btn.textContent = 'Link copied';
      setTimeout(function(){ btn.textContent = 'Share page'; }, 1800);
    }catch(e){
      btn.textContent = 'Copy failed';
      setTimeout(function(){ btn.textContent = 'Share page'; }, 1800);
    }
  });
</script>
